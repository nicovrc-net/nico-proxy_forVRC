# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: nicovrc-Site Check

on:
  schedule:
    - cron: '10 12 * * *'
      timezone: 'Asia/Tokyo'

jobs:
  build-27:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up JDK 27
        uses: actions/setup-java@v5.4.0
        with:
          java-version: '27'
          distribution: 'oracle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.1.0

      - name: Source Download
        run: |
          git clone https://github.com/nicovrc-net/nico-proxy_forVRC.git
          cd nico-proxy_forVRC
          git checkout master
          chmod +x ./gradlew
          ./gradlew shadowJar
          mv ./build/libs/*.jar ../NicoVideoPlayForVRC.jar
        shell: bash

      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: ./NicoVideoPlayForVRC.jar

  download_ffmpeg:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download ffmpeg
        run: |
          wget https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz > null
          tar -Jxvf ./ffmpeg-master-latest-linux64-gpl.tar.xz > null
          cp ./ffmpeg-master-latest-linux64-gpl/bin/* ./
          rm ./ffmpeg-master-latest-linux64-gpl.tar.xz
          rm ./ffmpeg-master-latest-linux64-gpl -fr
        shell: bash

      - name: Upload ffmpeg
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg
          path: ./ffmpeg

  autotest-sitecheck-niconico:
    needs: [build-27, download_ffmpeg]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Set up JDK
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '27'
          distribution: 'temurin'

      - name: Download JarFile
        uses: actions/download-artifact@v8.0.1
        with:
          name: jar

      - name: Download ffmpeg File
        uses: actions/download-artifact@v8.0.1
        with:
          name: ffmpeg

      - name: Make gradlew executable
        run: chmod +x ./ffmpeg

      - name: Run the Application
        run: java -jar ./NicoVideoPlayForVRC.jar --default-config-mode &
        shell: bash

      - name: Wait for the application to start
        run: |
          while ! ss -tl | grep -q '25252'; do
            sleep 1s
          done
        shell: bash

      - name: NicoNico Video Test
        if: always()
        run: |
          HTTP_STATUS=$( curl -m 5 -o /dev/null -s -w "%{content_type}" http://localhost:25252/?url=https://www.nicovideo.jp/watch/sm9 )
          if [ "$HTTP_STATUS" -ne "video/mp4" ]; then
            echo "OK"
          else
            exit 1
          fi
        shell: bash

      - name: NicoNico Live Test
        run: |
          HTTP_STATUS=$( curl -m 5 -o /dev/null -s -w "%{content_type}" http://localhost:25252/?url=https://cas.nicovideo.jp/user/70969122 )
          if [ "$HTTP_STATUS" -ne "video/mp4" ]; then
            echo "OK"
          else
            exit 1
          fi
        shell: bash

  autotest-sitecheck-bilibili:
